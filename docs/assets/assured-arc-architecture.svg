<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Assured Arc v1.1.0 — Minimal Architecture Map</title>
  <desc id="desc">High-contrast, large-type architecture diagram of Assured Arc v1.1.0 showing Dual-Host Entry (VS Code, Copilot CLI, Claude Code), Shared Contract and Lazy Skill Router (29 Skills), 7-Phase Bounded Orchestrator, 5 Isolated Workers (1 Writer, Web Surfing + MCP Researcher), and External Scoreboard Gate.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10B981"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#A855F7"/>
    </marker>
    <style>
      .title { font: 800 30px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; letter-spacing: 0.4px; }
      .subtitle { font: 700 15px 'Segoe UI', Inter, system-ui, sans-serif; fill: #E2E8F0; letter-spacing: 0.3px; }
      .zone { font: 800 14px 'Segoe UI', Inter, system-ui, sans-serif; fill: #94A3B8; letter-spacing: 1.8px; }
      .card { fill: #111827; stroke: #334155; stroke-width: 2; rx: 14; }
      .card-cyan { fill: #0C1B33; stroke: #0284C7; stroke-width: 2.2; rx: 14; }
      .card-violet { fill: #1B1233; stroke: #9333EA; stroke-width: 2.2; rx: 14; }
      .card-amber { fill: #26190A; stroke: #D97706; stroke-width: 2.2; rx: 14; }
      .card-emerald { fill: #07221B; stroke: #059669; stroke-width: 2.2; rx: 14; }
      .card-rose { fill: #28101B; stroke: #E11D48; stroke-width: 2.2; rx: 14; }
      .card-slate { fill: #162032; stroke: #475569; stroke-width: 1.8; rx: 10; }
      .h1 { font: 800 22px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; }
      .h2 { font: 800 17px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; }
      .body { font: 700 15.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #E2E8F0; }
      .muted { font: 700 14.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #CBD5E1; }
      .mono { font: 700 15px 'Cascadia Code', Consolas, monospace; fill: #38BDF8; }
      .mono-amber { font: 700 15px 'Cascadia Code', Consolas, monospace; fill: #FBBF24; }
      .mono-emerald { font: 700 15px 'Cascadia Code', Consolas, monospace; fill: #34D399; }
      .mono-rose { font: 700 15px 'Cascadia Code', Consolas, monospace; fill: #FB7185; }
      .mono-violet { font: 700 15px 'Cascadia Code', Consolas, monospace; fill: #C084FC; }
      .flow { fill: none; stroke: #38BDF8; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-cyan); }
      .flow-blue { fill: none; stroke: #10B981; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-emerald); }
      .flow-rust { fill: none; stroke: #F59E0B; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .route { fill: none; stroke: #A855F7; stroke-width: 3.2; stroke-dasharray: 7 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-violet); }
      .support { fill: none; stroke: #475569; stroke-width: 2.2; stroke-dasharray: 4 4; }
      .pulse-cyan { fill: #38BDF8; stroke: #F8FAFC; stroke-width: 2; }
      .pulse-amber { fill: #F59E0B; stroke: #F8FAFC; stroke-width: 2; }
      .pulse-emerald { fill: #10B981; stroke: #F8FAFC; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg-grad)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>

  <!-- HEADER -->
  <rect x="24" y="18" width="1152" height="72" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="46" y="50" class="title">ASSURED ARC v1.1.0</text>
  <text x="46" y="74" class="subtitle">DUAL-HOST WORKBENCH · 1-WRITER HARNESS · SCOREBOARD GATE</text>

  <rect x="650" y="34" width="124" height="40" rx="20" fill="#1B1233" stroke="#9333EA" stroke-width="1.8"/>
  <text x="712" y="59" text-anchor="middle" class="mono-violet">3 HOSTS</text>

  <rect x="786" y="34" width="132" height="40" rx="20" fill="#26190A" stroke="#D97706" stroke-width="1.8"/>
  <text x="852" y="59" text-anchor="middle" class="mono-amber">1 WRITER</text>

  <rect x="930" y="34" width="132" height="40" rx="20" fill="#07221B" stroke="#059669" stroke-width="1.8"/>
  <text x="996" y="59" text-anchor="middle" class="mono-emerald">29 SKILLS</text>

  <rect x="1074" y="34" width="84" height="40" rx="20" fill="#0C1B33" stroke="#0284C7" stroke-width="1.8"/>
  <text x="1116" y="59" text-anchor="middle" class="mono">CLEAN</text>

  <!-- COLUMN 1: HOSTS -->
  <text x="32" y="114" class="zone">1. HOSTS</text>

  <rect x="24" y="126" width="212" height="110" class="card-cyan"/>
  <text x="44" y="160" class="h1">VS Code</text>
  <text x="44" y="188" class="body">7 Visible Agents</text>
  <text x="44" y="214" class="mono">6 Slash Prompts</text>

  <rect x="24" y="250" width="212" height="110" class="card-cyan"/>
  <text x="44" y="284" class="h1">Copilot CLI</text>
  <text x="44" y="312" class="body">Shared Agents</text>
  <text x="44" y="338" class="mono">Task Pre-Gate</text>

  <rect x="24" y="374" width="212" height="110" class="card-violet"/>
  <text x="44" y="408" class="h1">Claude Code</text>
  <text x="44" y="436" class="body">6 Role Adapters</text>
  <text x="44" y="462" class="mono-violet">.claude/agents/*</text>

  <!-- COLUMN 2: CONTRACT & ROUTER -->
  <text x="272" y="114" class="zone">2. CONTRACT &amp; ROUTER</text>

  <rect x="264" y="126" width="244" height="172" class="card-amber"/>
  <text x="284" y="160" class="h1">Shared Contract</text>
  <text x="284" y="186" class="mono-amber">agent-contract.json</text>
  <rect x="284" y="202" width="204" height="36" class="card-slate"/>
  <text x="386" y="225" text-anchor="middle" class="mono">Depth=1 · Writer=1</text>
  <rect x="284" y="246" width="204" height="36" class="card-slate"/>
  <text x="386" y="269" text-anchor="middle" class="body">Reuse &amp; Anti-Bloat</text>

  <rect x="264" y="312" width="244" height="172" class="card-violet"/>
  <text x="284" y="346" class="h1">Lazy Skill Router</text>
  <text x="284" y="372" class="mono-violet">skill-registry.json</text>
  <rect x="284" y="388" width="204" height="36" class="card-slate"/>
  <text x="386" y="411" text-anchor="middle" class="mono">Pick ≤ 3 Skills</text>
  <rect x="284" y="432" width="204" height="36" rx="10" fill="#07221B" stroke="#059669" stroke-width="1.8"/>
  <text x="386" y="455" text-anchor="middle" class="mono-emerald">29 Workflows</text>

  <!-- COLUMN 3: ORCHESTRATOR -->
  <text x="544" y="114" class="zone">3. ORCHESTRATOR</text>

  <rect x="536" y="126" width="320" height="358" class="card"/>
  <text x="558" y="162" class="h1">Orchestrator Loop</text>
  <text x="558" y="188" class="mono">read · search · agent</text>

  <rect x="558" y="206" width="132" height="44" class="card-slate"/>
  <text x="624" y="234" text-anchor="middle" class="h2">1. Contract</text>

  <rect x="702" y="206" width="132" height="44" class="card-slate"/>
  <text x="768" y="234" text-anchor="middle" class="h2">2. Route ≤ 3</text>

  <rect x="558" y="262" width="132" height="44" class="card-slate"/>
  <text x="624" y="290" text-anchor="middle" class="h2">3. Delegate</text>

  <rect x="702" y="262" width="132" height="44" class="card-amber"/>
  <text x="768" y="290" text-anchor="middle" class="mono-amber">4. 1-Writer</text>

  <rect x="558" y="318" width="132" height="44" class="card-emerald"/>
  <text x="624" y="346" text-anchor="middle" class="mono-emerald">5. Verify</text>

  <rect x="702" y="318" width="132" height="44" class="card-slate"/>
  <text x="768" y="346" text-anchor="middle" class="h2">6. Repair ≤ 2</text>

  <rect x="558" y="374" width="276" height="44" class="card-cyan"/>
  <text x="696" y="402" text-anchor="middle" class="h2">7. Scoreboard Gate</text>

  <text x="696" y="454" text-anchor="middle" class="muted">Max 3 Parallel · 7 Session</text>

  <!-- COLUMN 4: SPECIALISTS -->
  <text x="892" y="114" class="zone">4. DISPOSABLE WORKERS</text>

  <rect x="884" y="126" width="292" height="62" class="card-slate"/>
  <text x="904" y="154" class="h2">Scout</text>
  <text x="1156" y="154" text-anchor="end" class="mono">read · search</text>
  <text x="904" y="176" class="muted">Map reusable modules</text>

  <rect x="884" y="198" width="292" height="66" class="card-violet"/>
  <text x="904" y="226" class="h2">Researcher</text>
  <text x="1156" y="226" text-anchor="end" class="mono-violet">web · MCP</text>
  <text x="904" y="250" class="muted">Live Web · Context7 · arXiv</text>

  <rect x="884" y="274" width="292" height="68" class="card-amber"/>
  <text x="904" y="302" class="h2">Implementer</text>
  <text x="1156" y="302" text-anchor="end" class="mono-amber">ONLY WRITER</text>
  <text x="904" y="326" class="muted">Offline · Reuse · No Bloat</text>

  <rect x="884" y="352" width="292" height="62" class="card-emerald"/>
  <text x="904" y="380" class="h2">Verifier</text>
  <text x="1156" y="380" text-anchor="end" class="mono-emerald">read · exec</text>
  <text x="904" y="402" class="muted">Runs checks · No edits</text>

  <rect x="884" y="424" width="292" height="60" class="card-slate"/>
  <text x="904" y="452" class="h2">Critic</text>
  <text x="1156" y="452" text-anchor="end" class="mono">read · search</text>
  <text x="904" y="473" class="muted">Security &amp; bloat check</text>

  <!-- BOTTOM GOVERNANCE & SCOREBOARD BAR -->
  <text x="32" y="518" class="zone">5. DETERMINISTIC HOOK GATES &amp; REVERSIBLE LIFECYCLE</text>

  <rect x="24" y="530" width="368" height="168" class="card-rose"/>
  <text x="44" y="566" class="h1">Human-Gated Hooks</text>
  <text x="44" y="596" class="body">Locks .github/*, .claude/*, config/*</text>
  <text x="44" y="624" class="body">Enforces 1-writer &amp; budgets</text>
  <rect x="44" y="642" width="328" height="38" rx="8" fill="#1F0B14" stroke="#E11D48" stroke-width="1.8"/>
  <text x="208" y="666" text-anchor="middle" class="mono-rose">HUMAN_GATE = closed</text>

  <rect x="412" y="530" width="376" height="168" class="card-emerald"/>
  <text x="432" y="566" class="h1">Scoreboard Gate</text>
  <text x="432" y="596" class="body">Stop hook runs scoreboard.py</text>
  <text x="432" y="624" class="body">32-hex nonce + hygiene check</text>
  <rect x="432" y="642" width="336" height="38" rx="8" fill="#051B14" stroke="#10B981" stroke-width="1.8"/>
  <text x="600" y="666" text-anchor="middle" class="mono-emerald">verification-receipt: PASS</text>

  <rect x="808" y="530" width="368" height="168" class="card-cyan"/>
  <text x="828" y="566" class="h1">Reversible State v4</text>
  <text x="828" y="596" class="body">SHA-256 · Doctor · Rollback</text>
  <text x="828" y="624" class="body">Obsidian Vault · Zero-PII Trace</text>
  <rect x="828" y="642" width="328" height="38" rx="8" fill="#0B192C" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="992" y="666" text-anchor="middle" class="mono">Auditable Delivery Ready</text>

  <!-- CAUSAL CONNECTOR PATHS (Animated) -->
  <path id="flow-objective-contract" data-motion-intent="causality: developer objective and host surfaces enter the dual-host contract" d="M 236 181 L 250 181 L 250 212 L 264 212" class="flow-rust"/>
  <path d="M 236 305 L 250 305 L 250 212 L 264 212" class="flow"/>
  <path d="M 236 429 L 250 429 L 250 212 L 264 212" class="route"/>
  <path d="M 386 298 L 386 312" class="flow-rust"/>

  <path id="flow-router-loop" data-motion-intent="progress: routed skills and contract enter bounded orchestrator loop" d="M 508 398 L 522 398 L 522 305 L 536 305" class="flow"/>

  <path id="flow-loop-workers" data-motion-intent="handoff: orchestrator dispatches isolated specialist workers" d="M 856 305 L 870 305 L 870 308 L 884 308" class="flow-rust"/>
  <path d="M 870 157 L 884 157 M 870 231 L 884 231 M 870 383 L 884 383 M 870 454 L 884 454 M 870 157 L 870 454" class="support"/>

  <path id="flow-scoreboard-release" data-motion-intent="verification: scoreboard gate releases verified outcome" d="M 696 484 L 696 530 M 788 614 L 808 614" class="flow-blue"/>

  <g>
    <circle r="9" fill="#F59E0B" opacity="0.3"/>
    <circle r="5" class="pulse-amber"/>
    <animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#flow-objective-contract"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="#38BDF8" opacity="0.3"/>
    <circle r="5" class="pulse-cyan"/>
    <animateMotion dur="2.0s" begin="0.5s" repeatCount="indefinite"><mpath href="#flow-router-loop"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="#F59E0B" opacity="0.3"/>
    <circle r="5" class="pulse-amber"/>
    <animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite"><mpath href="#flow-loop-workers"/></animateMotion>
  </g>
  <g>
    <circle r="10" fill="#10B981" opacity="0.3"/>
    <circle r="5.5" class="pulse-emerald"/>
    <animateMotion dur="2.0s" begin="1.5s" repeatCount="indefinite"><mpath href="#flow-scoreboard-release"/></animateMotion>
  </g>
</svg>
