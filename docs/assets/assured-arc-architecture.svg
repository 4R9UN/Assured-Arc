<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 768" width="1280" height="768" role="img" aria-labelledby="title desc">
  <title id="title">Assured Arc v1.1.0 Architecture &amp; Dual-Host Workflow</title>
  <desc id="desc">Modern, crisp architecture diagram of Assured Arc v1.1.0 showing Dual-Host Entry Surfaces (VS Code, GitHub Copilot CLI, Claude Code), Shared Control Contract and Lazy Skill Router, 7-Phase Bounded Orchestrator Loop, 5 Isolated Disposable Specialists with Single-Writer lock, External Scoreboard Verification Gate, and Support Planes.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1325"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10B981"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#A855F7"/>
    </marker>
    <style>
      .title { font: 800 24px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; letter-spacing: 0.4px; }
      .subtitle { font: 600 12.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #94A3B8; letter-spacing: 0.3px; }
      .badge-text { font: 700 11px 'Cascadia Code', Consolas, monospace; fill: #38BDF8; letter-spacing: 0.5px; }
      .zone { font: 800 11px 'Segoe UI', Inter, system-ui, sans-serif; fill: #64748B; letter-spacing: 2px; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .card-cyan { fill: #0F1E36; stroke: #0284C7; stroke-width: 1.8; rx: 12; }
      .card-violet { fill: #1E1436; stroke: #9333EA; stroke-width: 1.8; rx: 12; }
      .card-amber { fill: #271C0C; stroke: #D97706; stroke-width: 1.8; rx: 12; }
      .card-emerald { fill: #09261E; stroke: #059669; stroke-width: 1.8; rx: 12; }
      .card-rose { fill: #2A121D; stroke: #E11D48; stroke-width: 1.8; rx: 12; }
      .card-slate { fill: #161F30; stroke: #475569; stroke-width: 1.5; rx: 10; }
      .h1 { font: 700 15px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; }
      .h2 { font: 700 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #E2E8F0; }
      .body { font: 600 11.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #CBD5E1; }
      .muted { font: 500 10.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #94A3B8; }
      .mono { font: 600 10.5px 'Cascadia Code', Consolas, monospace; fill: #38BDF8; }
      .mono-amber { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #FBBF24; }
      .mono-emerald { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #34D399; }
      .mono-rose { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #FB7185; }
      .mono-violet { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #C084FC; }
      .phase-box { fill: #1E293B; stroke: #38BDF8; stroke-width: 1.5; rx: 8; }
      .phase-label { font: 700 11px 'Cascadia Code', Consolas, monospace; fill: #F8FAFC; }
      .flow { fill: none; stroke: #38BDF8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-cyan); }
      .flow-blue { fill: none; stroke: #10B981; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-emerald); }
      .flow-rust { fill: none; stroke: #F59E0B; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .route { fill: none; stroke: #A855F7; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-violet); }
      .support { fill: none; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5 4; stroke-linecap: round; }
      .pulse-cyan { fill: #38BDF8; stroke: #F8FAFC; stroke-width: 2; }
      .pulse-amber { fill: #F59E0B; stroke: #F8FAFC; stroke-width: 2; }
      .pulse-emerald { fill: #10B981; stroke: #F8FAFC; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1280" height="768" fill="url(#bg-grad)"/>
  <rect width="1280" height="768" fill="url(#grid)"/>
  <rect x="16" y="16" width="1248" height="736" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="26" width="1224" height="64" rx="12" fill="url(#header-grad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="46" y="42" width="96" height="32" rx="8" fill="#0F1E36" stroke="#0284C7" stroke-width="1.5"/>
  <text x="94" y="62" text-anchor="middle" class="badge-text">v1.1.0</text>
  <text x="160" y="54" class="title">ASSURED ARC ARCHITECTURE</text>
  <text x="160" y="74" class="subtitle">Dual-Host Agent Contract · Bounded Depth-1 Subagents · Single-Writer Lock · External Scoreboard Gate</text>
  <rect x="860" y="40" width="118" height="36" rx="8" fill="#161F30" stroke="#475569" stroke-width="1.2"/>
  <text x="919" y="55" text-anchor="middle" class="mono">3 SURFACES</text>
  <text x="919" y="69" text-anchor="middle" class="muted">VS Code · CLI · Claude</text>
  <rect x="990" y="40" width="118" height="36" rx="8" fill="#09261E" stroke="#059669" stroke-width="1.2"/>
  <text x="1049" y="55" text-anchor="middle" class="mono-emerald">1 WRITER</text>
  <text x="1049" y="69" text-anchor="middle" class="muted">Depth 1 · ≤3 Parallel</text>
  <rect x="1120" y="40" width="118" height="36" rx="8" fill="#2A121D" stroke="#E11D48" stroke-width="1.2"/>
  <text x="1179" y="55" text-anchor="middle" class="mono-rose">HUMAN GATE</text>
  <text x="1179" y="69" text-anchor="middle" class="muted">Nonce Scoreboard</text>

  <text x="36" y="114" class="zone">1. HOST SURFACES</text>
  <text x="286" y="114" class="zone">2. CONTRACT &amp; ROUTING</text>
  <text x="568" y="114" class="zone">3. BOUNDED ORCHESTRATOR LOOP</text>
  <text x="938" y="114" class="zone">4. ISOLATED SPECIALISTS</text>

  <!-- COLUMN 1: ENTRY SURFACES -->
  <rect x="34" y="128" width="224" height="78" class="card-amber"/>
  <text x="52" y="152" class="h2">Developer Objective</text>
  <text x="52" y="171" class="body">Intent + explicit constraints</text>
  <text x="52" y="190" class="mono-amber">Current-turn human approval</text>

  <rect x="34" y="224" width="224" height="86" class="card-cyan"/>
  <text x="52" y="248" class="h2">VS Code Copilot</text>
  <text x="52" y="267" class="body">7 Visible + 5 Hidden Agents</text>
  <text x="52" y="285" class="mono">6 Slash Prompts · Hooks</text>
  <rect x="184" y="233" width="60" height="20" rx="5" fill="#0284C7"/>
  <text x="214" y="247" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#F8FAFC">IDE</text>

  <rect x="34" y="324" width="224" height="86" class="card-slate"/>
  <text x="52" y="348" class="h2">GitHub Copilot CLI</text>
  <text x="52" y="367" class="body">Repo + Personal CLI Profile</text>
  <text x="52" y="385" class="mono">preToolUse Task Reservation</text>
  <rect x="184" y="333" width="60" height="20" rx="5" fill="#475569"/>
  <text x="214" y="347" text-anchor="middle" font-family="Cascadia Code, monospace" font-size="10" font-weight="700" fill="#F8FAFC">&gt;_ CLI</text>

  <rect x="34" y="424" width="224" height="92" class="card-violet"/>
  <text x="52" y="448" class="h2">Claude Code Adapter</text>
  <text x="52" y="467" class="body">Rendered via render_contract.py</text>
  <text x="52" y="485" class="mono-violet">.claude/agents + settings.json</text>
  <text x="52" y="503" class="muted">Never copies Copilot files</text>
  <rect x="184" y="433" width="60" height="20" rx="5" fill="#9333EA"/>
  <text x="214" y="447" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#F8FAFC">NEW</text>

  <!-- COLUMN 2: CONTROL CONTRACT & SKILL ROUTER -->
  <rect x="286" y="128" width="252" height="196" class="card-amber"/>
  <circle cx="312" cy="156" r="13" fill="#D97706"/>
  <text x="312" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#0B0F19">1</text>
  <text x="334" y="161" class="h1">Dual-Host Contract</text>
  <text x="304" y="182" class="mono-amber">config/agent-contract.json</text>
  <line x1="304" y1="194" x2="520" y2="194" stroke="#78350F" stroke-width="1.2"/>
  <text x="304" y="214" class="body">• Restate acceptance criteria</text>
  <text x="304" y="234" class="body">• Narrow file &amp; tool write scope</text>
  <text x="304" y="254" class="body">• External content = tainted data</text>
  <text x="304" y="274" class="body">• No runtime agent/skill creation</text>
  <rect x="304" y="288" width="216" height="24" rx="6" fill="#1E1B18" stroke="#D97706" stroke-width="1"/>
  <text x="412" y="304" text-anchor="middle" class="mono-amber">selfScoreAllowed: false</text>

  <rect x="286" y="344" width="252" height="172" class="card-cyan"/>
  <circle cx="312" cy="372" r="13" fill="#0284C7"/>
  <text x="312" y="376" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#0B0F19">2</text>
  <text x="334" y="377" class="h1">Lazy Skill Router</text>
  <text x="304" y="398" class="mono">config/skill-registry.json</text>
  <line x1="304" y1="410" x2="520" y2="410" stroke="#0369A1" stroke-width="1.2"/>
  <text x="304" y="430" class="body">• 27 Curated Portable Skills</text>
  <text x="304" y="450" class="body">• Selects ≤ 3 Domain Skills</text>
  <text x="304" y="470" class="body">• Auto-adds Development Quality</text>
  <rect x="304" y="482" width="216" height="22" rx="6" fill="#0B192C" stroke="#0284C7" stroke-width="1"/>
  <text x="412" y="497" text-anchor="middle" class="mono">Trusted Selectors Only</text>
  <!-- COLUMN 3: BOUNDED ORCHESTRATOR LOOP -->
  <rect x="568" y="128" width="340" height="388" class="card"/>
  <rect x="584" y="142" width="308" height="30" rx="6" fill="#161F30" stroke="#334155" stroke-width="1"/>
  <text x="738" y="161" text-anchor="middle" class="mono">DEPTH 1 · MAX 48 TOOLS · MAX 7 WORKERS</text>

  <circle cx="738" cy="316" r="108" fill="none" stroke="#1E293B" stroke-width="16"/>
  <circle cx="738" cy="316" r="108" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="738" cy="316" r="62" fill="#0F1E36" stroke="#38BDF8" stroke-width="2.5"/>
  <text x="738" y="305" text-anchor="middle" class="h2">ORCHESTRATOR</text>
  <text x="738" y="323" text-anchor="middle" class="mono">read · search · agent</text>
  <text x="738" y="340" text-anchor="middle" class="muted">Never edits directly</text>

  <rect x="692" y="182" width="92" height="28" class="phase-box"/>
  <text x="738" y="200" text-anchor="middle" class="phase-label">1.CONTRACT</text>
  <rect x="802" y="222" width="90" height="28" class="phase-box"/>
  <text x="847" y="240" text-anchor="middle" class="phase-label">2.ROUTE</text>
  <rect x="812" y="302" width="90" height="28" class="phase-box"/>
  <text x="857" y="320" text-anchor="middle" class="phase-label">3.DELEGATE</text>
  <rect x="802" y="382" width="90" height="28" class="phase-box"/>
  <text x="847" y="400" text-anchor="middle" class="phase-label">4.ACT</text>
  <rect x="692" y="422" width="92" height="28" rx="8" fill="#09261E" stroke="#10B981" stroke-width="1.8"/>
  <text x="738" y="440" text-anchor="middle" class="mono-emerald">5.VERIFY</text>
  <rect x="584" y="382" width="90" height="28" rx="8" fill="#271C0C" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="629" y="400" text-anchor="middle" class="mono-amber">6.REPAIR≤2</text>
  <rect x="584" y="256" width="90" height="28" rx="8" fill="#09261E" stroke="#10B981" stroke-width="1.8"/>
  <text x="629" y="274" text-anchor="middle" class="mono-emerald">7.COMPLETE</text>

  <rect x="584" y="468" width="308" height="32" rx="6" fill="#09261E" stroke="#059669" stroke-width="1.2"/>
  <text x="738" y="488" text-anchor="middle" class="mono-emerald">Stop Hook: Requires Scoreboard Nonce Receipt</text>

  <!-- COLUMN 4: 5 DISPOSABLE WORKERS -->
  <rect x="938" y="128" width="308" height="68" class="card-cyan"/>
  <text x="956" y="151" class="h2">Disposable Scout</text>
  <text x="1230" y="151" text-anchor="end" class="mono">read · search</text>
  <text x="956" y="172" class="muted">Fast local repository mapping · agents: []</text>

  <rect x="938" y="208" width="308" height="68" class="card-violet"/>
  <text x="956" y="231" class="h2">Disposable Researcher</text>
  <text x="1230" y="231" text-anchor="end" class="mono-violet">web · MCP</text>
  <text x="956" y="252" class="muted">Context7 · Sequential Thinking · arXiv (No Edit)</text>

  <rect x="938" y="288" width="308" height="76" class="card-amber"/>
  <text x="956" y="312" class="h2">Disposable Implementer</text>
  <rect x="1136" y="296" width="96" height="20" rx="5" fill="#D97706"/>
  <text x="1184" y="310" text-anchor="middle" font-family="Cascadia Code, monospace" font-size="10" font-weight="800" fill="#0B0F19">ONLY WRITER</text>
  <text x="956" y="333" class="body">read · edit · search (No Execute / No Web)</text>
  <text x="956" y="351" class="mono-amber">Marks session pendingVerification = true</text>

  <rect x="938" y="376" width="308" height="68" class="card-emerald"/>
  <text x="956" y="399" class="h2">Disposable Verifier</text>
  <text x="1230" y="399" text-anchor="end" class="mono-emerald">read · execute</text>
  <text x="956" y="420" class="muted">Runs checks · Cannot edit or self-mint receipt</text>

  <rect x="938" y="456" width="308" height="60" class="card-slate"/>
  <text x="956" y="479" class="h2">Disposable Critic</text>
  <text x="1230" y="479" text-anchor="end" class="mono">read · search</text>
  <text x="956" y="499" class="muted">Challenges security, regressions &amp; complexity</text>
  <!-- BOTTOM SUPPORT PLANES -->
  <text x="36" y="544" class="zone">5. GOVERNANCE, VERIFICATION SCOREBOARD &amp; SUPPORT PLANES</text>

  <rect x="34" y="558" width="286" height="174" class="card-violet"/>
  <text x="52" y="584" class="h1">Knowledge &amp; Research MCP</text>
  <text x="52" y="608" class="body">• Obsidian Markdown Vault + MOCs</text>
  <text x="52" y="628" class="body">• Context7 (HTTPS Library Docs)</text>
  <text x="52" y="648" class="body">• Sequential Thinking 2026.7.4</text>
  <text x="52" y="668" class="body">• Isolated arXiv MCP Server 0.5.1</text>
  <rect x="52" y="688" width="250" height="26" rx="6" fill="#140D26" stroke="#9333EA" stroke-width="1"/>
  <text x="177" y="705" text-anchor="middle" class="mono-violet">Isolated from Implementer Writer</text>

  <rect x="338" y="558" width="302" height="174" class="card-rose"/>
  <text x="356" y="584" class="h1">Strict Human-Gated Hooks</text>
  <text x="356" y="608" class="body">• Precedence: Human Gate before Ask</text>
  <text x="356" y="628" class="body">• Protects agents, skills, hooks, config</text>
  <text x="356" y="648" class="body">• Single-writer lock + tool budgets</text>
  <text x="356" y="668" class="body">• Metadata-only traces (14d retention)</text>
  <rect x="356" y="688" width="266" height="26" rx="6" fill="#1F0B14" stroke="#E11D48" stroke-width="1"/>
  <text x="489" y="705" text-anchor="middle" class="mono-rose">ASSURED_ARC_HUMAN_GATE = closed</text>

  <rect x="658" y="558" width="302" height="174" class="card-emerald"/>
  <text x="676" y="584" class="h1">External Scoreboard Gate</text>
  <text x="676" y="608" class="body">• scripts/scoreboard.py + config/checks</text>
  <text x="676" y="628" class="body">• 32-hex cryptographic nonce per run</text>
  <text x="676" y="648" class="body">• Blocks Stop hook after any write tool</text>
  <text x="676" y="668" class="body">• Rejects forged or self-scored receipts</text>
  <rect x="676" y="688" width="266" height="26" rx="6" fill="#051B14" stroke="#10B981" stroke-width="1"/>
  <text x="809" y="705" text-anchor="middle" class="mono-emerald">verification-receipt: PASS</text>

  <rect x="978" y="558" width="268" height="174" class="card-cyan"/>
  <text x="996" y="584" class="h1">Verified Outcome &amp; State</text>
  <text x="996" y="608" class="body">• State Schema 4 Ownership Ledger</text>
  <text x="996" y="628" class="body">• Reversible Install, Doctor &amp; Rollback</text>
  <text x="996" y="648" class="body">• Atomic Privacy-Safe Run Receipt</text>
  <text x="996" y="668" class="body">• Evidence + Residual Risk Summary</text>
  <rect x="996" y="688" width="232" height="26" rx="6" fill="#0B192C" stroke="#38BDF8" stroke-width="1"/>
  <text x="1112" y="705" text-anchor="middle" class="mono">Auditable Delivery Complete</text>

  <!-- CAUSAL CONNECTOR PATHS (Animated) -->
  <path id="flow-objective-contract" data-motion-intent="causality: developer objective and host surfaces enter the dual-host contract" d="M 258 167 L 272 167 L 272 226 L 286 226" class="flow-rust"/>
  <path d="M 258 267 L 272 267 L 272 226 L 286 226" class="flow"/>
  <path d="M 258 367 L 272 367 L 272 226 L 286 226" class="flow"/>
  <path d="M 258 468 L 272 468 L 272 226 L 286 226" class="route"/>
  <path d="M 412 324 L 412 344" class="flow-rust"/>

  <path id="flow-router-loop" data-motion-intent="progress: routed skills and contract enter bounded orchestrator loop" d="M 538 430 L 553 430 L 553 316 L 568 316" class="flow"/>

  <path id="flow-loop-workers" data-motion-intent="handoff: orchestrator dispatches isolated specialist workers" d="M 902 316 L 920 316 L 920 326 L 938 326" class="flow-rust"/>
  <path d="M 920 162 L 938 162 M 920 242 L 938 242 M 920 410 L 938 410 M 920 486 L 938 486 M 920 162 L 920 486" class="support"/>

  <path id="flow-scoreboard-release" data-motion-intent="verification: scoreboard gate releases verified outcome" d="M 738 500 L 738 558 L 960 558 L 960 645 L 978 645" class="flow-blue"/>

  <g>
    <circle r="9" fill="#F59E0B" opacity="0.28"/>
    <circle r="5" class="pulse-amber"/>
    <animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#flow-objective-contract"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="#38BDF8" opacity="0.28"/>
    <circle r="5" class="pulse-cyan"/>
    <animateMotion dur="2.0s" begin="0.5s" repeatCount="indefinite"><mpath href="#flow-router-loop"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="#F59E0B" opacity="0.28"/>
    <circle r="5" class="pulse-amber"/>
    <animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite"><mpath href="#flow-loop-workers"/></animateMotion>
  </g>
  <g>
    <circle r="10" fill="#10B981" opacity="0.28"/>
    <circle r="5.5" class="pulse-emerald"/>
    <animateMotion dur="2.0s" begin="1.5s" repeatCount="indefinite"><mpath href="#flow-scoreboard-release"/></animateMotion>
  </g>
</svg>
