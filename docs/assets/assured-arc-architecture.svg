<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 768" width="1280" height="768" role="img" aria-labelledby="title desc">
  <title id="title">Assured Arc v1.1.0 — Minimal Architecture Map</title>
  <desc id="desc">High-contrast, minimal-text architecture diagram of Assured Arc v1.1.0 showing Dual-Host Entry (VS Code, Copilot CLI, Claude Code), Shared Contract and Lazy Skill Router (28 Skills), 7-Phase Bounded Orchestrator, 5 Isolated Workers (1 Writer, Web Surfing + MCP Researcher), and External Scoreboard Gate.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10B981"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#A855F7"/>
    </marker>
    <style>
      .title { font: 800 26px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; letter-spacing: 0.4px; }
      .subtitle { font: 600 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #94A3B8; letter-spacing: 0.4px; }
      .zone { font: 800 11.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #64748B; letter-spacing: 2.2px; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.8; rx: 14; }
      .card-cyan { fill: #0C1B33; stroke: #0284C7; stroke-width: 2; rx: 14; }
      .card-violet { fill: #1B1233; stroke: #9333EA; stroke-width: 2; rx: 14; }
      .card-amber { fill: #26190A; stroke: #D97706; stroke-width: 2; rx: 14; }
      .card-emerald { fill: #07221B; stroke: #059669; stroke-width: 2; rx: 14; }
      .card-rose { fill: #28101B; stroke: #E11D48; stroke-width: 2; rx: 14; }
      .card-slate { fill: #162032; stroke: #475569; stroke-width: 1.6; rx: 12; }
      .h1 { font: 800 19px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; }
      .h2 { font: 700 15px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F1F5F9; }
      .body { font: 600 12.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #CBD5E1; }
      .muted { font: 600 11.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #94A3B8; }
      .mono { font: 700 11.5px 'Cascadia Code', Consolas, monospace; fill: #38BDF8; }
      .mono-amber { font: 700 11.5px 'Cascadia Code', Consolas, monospace; fill: #FBBF24; }
      .mono-emerald { font: 700 11.5px 'Cascadia Code', Consolas, monospace; fill: #34D399; }
      .mono-rose { font: 700 11.5px 'Cascadia Code', Consolas, monospace; fill: #FB7185; }
      .mono-violet { font: 700 11.5px 'Cascadia Code', Consolas, monospace; fill: #C084FC; }
      .flow { fill: none; stroke: #38BDF8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-cyan); }
      .flow-blue { fill: none; stroke: #10B981; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-emerald); }
      .flow-rust { fill: none; stroke: #F59E0B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .route { fill: none; stroke: #A855F7; stroke-width: 3; stroke-dasharray: 7 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-violet); }
      .support { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 4 4; }
      .pulse-cyan { fill: #38BDF8; stroke: #F8FAFC; stroke-width: 2; }
      .pulse-amber { fill: #F59E0B; stroke: #F8FAFC; stroke-width: 2; }
      .pulse-emerald { fill: #10B981; stroke: #F8FAFC; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1280" height="768" fill="url(#bg-grad)"/>
  <rect width="1280" height="768" fill="url(#grid)"/>

  <!-- HEADER -->
  <rect x="28" y="24" width="1224" height="68" rx="14" fill="#111827" stroke="#334155" stroke-width="1.8"/>
  <text x="52" y="54" class="title">ASSURED ARC</text>
  <text x="52" y="76" class="subtitle">DUAL-HOST AGENT WORKBENCH · SINGLE-WRITER HARNESS · SCOREBOARD VERIFICATION</text>

  <rect x="680" y="38" width="110" height="38" rx="19" fill="#0C1B33" stroke="#0284C7" stroke-width="1.5"/>
  <text x="735" y="61" text-anchor="middle" class="mono">v1.1.0</text>

  <rect x="804" y="38" width="136" height="38" rx="19" fill="#1B1233" stroke="#9333EA" stroke-width="1.5"/>
  <text x="872" y="61" text-anchor="middle" class="mono-violet">3 HOSTS</text>

  <rect x="954" y="38" width="136" height="38" rx="19" fill="#26190A" stroke="#D97706" stroke-width="1.5"/>
  <text x="1022" y="61" text-anchor="middle" class="mono-amber">1 WRITER</text>

  <rect x="1104" y="38" width="130" height="38" rx="19" fill="#07221B" stroke="#059669" stroke-width="1.5"/>
  <text x="1169" y="61" text-anchor="middle" class="mono-emerald">28 SKILLS</text>

  <!-- COLUMN 1: HOSTS -->
  <text x="40" y="122" class="zone">1. ENTRY HOSTS</text>

  <rect x="34" y="138" width="218" height="110" class="card-cyan"/>
  <text x="56" y="172" class="h1">VS Code</text>
  <text x="56" y="198" class="body">7 Visible Agents</text>
  <text x="56" y="220" class="mono">6 Slash Prompts</text>

  <rect x="34" y="266" width="218" height="110" class="card-cyan"/>
  <text x="56" y="300" class="h1">Copilot CLI</text>
  <text x="56" y="326" class="body">Shared Agents &amp; Skills</text>
  <text x="56" y="348" class="mono">Task Pre-Gate Hooks</text>

  <rect x="34" y="394" width="218" height="110" class="card-violet"/>
  <text x="56" y="428" class="h1">Claude Code</text>
  <text x="56" y="454" class="body">6 Native Role Adapters</text>
  <text x="56" y="476" class="mono-violet">.claude/agents/*.md</text>

  <!-- COLUMN 2: CONTRACT & ROUTER -->
  <text x="292" y="122" class="zone">2. CONTRACT &amp; ROUTER</text>

  <rect x="286" y="138" width="246" height="174" class="card-amber"/>
  <text x="308" y="172" class="h1">Shared Contract</text>
  <text x="308" y="198" class="mono-amber">agent-contract.json</text>
  <rect x="308" y="216" width="96" height="32" rx="8" fill="#162032" stroke="#475569"/>
  <text x="356" y="236" text-anchor="middle" class="mono">Depth = 1</text>
  <rect x="416" y="216" width="94" height="32" rx="8" fill="#162032" stroke="#475569"/>
  <text x="463" y="236" text-anchor="middle" class="mono-amber">Writers = 1</text>
  <rect x="308" y="258" width="202" height="32" rx="8" fill="#162032" stroke="#475569"/>
  <text x="409" y="278" text-anchor="middle" class="body">No On-Task Self-Mutation</text>

  <rect x="286" y="330" width="246" height="174" class="card-violet"/>
  <text x="308" y="364" class="h1">Lazy Skill Router</text>
  <text x="308" y="390" class="mono-violet">skill-registry.json</text>
  <rect x="308" y="408" width="202" height="34" rx="8" fill="#162032" stroke="#475569"/>
  <text x="409" y="430" text-anchor="middle" class="mono">Selects ≤ 3 Domain Skills</text>
  <rect x="308" y="452" width="202" height="34" rx="8" fill="#07221B" stroke="#059669"/>
  <text x="409" y="474" text-anchor="middle" class="mono-emerald">28 Portable Workflows</text>

  <!-- COLUMN 3: ORCHESTRATOR -->
  <text x="574" y="122" class="zone">3. BOUNDED ORCHESTRATOR</text>

  <rect x="568" y="138" width="328" height="366" class="card"/>
  <text x="592" y="174" class="h1">Orchestrator Loop</text>
  <text x="592" y="198" class="mono">Tools: read · search · agent</text>

  <rect x="592" y="220" width="134" height="44" class="card-slate"/>
  <text x="659" y="247" text-anchor="middle" class="h2">1. Contract</text>

  <rect x="740" y="220" width="134" height="44" class="card-slate"/>
  <text x="807" y="247" text-anchor="middle" class="h2">2. Route ≤ 3</text>

  <rect x="592" y="278" width="134" height="44" class="card-slate"/>
  <text x="659" y="305" text-anchor="middle" class="h2">3. Delegate</text>

  <rect x="740" y="278" width="134" height="44" class="card-amber"/>
  <text x="807" y="305" text-anchor="middle" class="mono-amber">4. Act (1 Writer)</text>

  <rect x="592" y="336" width="134" height="44" class="card-emerald"/>
  <text x="659" y="363" text-anchor="middle" class="mono-emerald">5. Verify</text>

  <rect x="740" y="336" width="134" height="44" class="card-slate"/>
  <text x="807" y="363" text-anchor="middle" class="h2">6. Repair ≤ 2</text>

  <rect x="592" y="396" width="282" height="44" class="card-cyan"/>
  <text x="733" y="423" text-anchor="middle" class="h2">7. Complete (Scoreboard Pass)</text>

  <text x="733" y="476" text-anchor="middle" class="muted">Max 3 Concurrent · Max 7 Session Workers</text>

  <!-- COLUMN 4: SPECIALISTS -->
  <text x="940" y="122" class="zone">4. DISPOSABLE WORKERS</text>

  <rect x="934" y="138" width="312" height="62" class="card-slate"/>
  <text x="956" y="168" class="h2">Scout</text>
  <text x="1224" y="168" text-anchor="end" class="mono">read · search</text>
  <text x="956" y="188" class="muted">Fast repository mapping</text>

  <rect x="934" y="212" width="312" height="68" class="card-violet"/>
  <text x="956" y="242" class="h2">Researcher</text>
  <text x="1224" y="242" text-anchor="end" class="mono-violet">web · MCP</text>
  <text x="956" y="264" class="muted">Live Web Surfing · Context7 · arXiv</text>

  <rect x="934" y="292" width="312" height="68" class="card-amber"/>
  <text x="956" y="322" class="h2">Implementer</text>
  <text x="1224" y="322" text-anchor="end" class="mono-amber">ONLY WRITER</text>
  <text x="956" y="344" class="muted">Offline · No Web/MCP · No Bash</text>

  <rect x="934" y="372" width="312" height="62" class="card-emerald"/>
  <text x="956" y="402" class="h2">Verifier</text>
  <text x="1224" y="402" text-anchor="end" class="mono-emerald">read · execute</text>
  <text x="956" y="422" class="muted">Runs checks · No file edits</text>

  <rect x="934" y="446" width="312" height="58" class="card-slate"/>
  <text x="956" y="474" class="h2">Critic</text>
  <text x="1224" y="474" text-anchor="end" class="mono">read · search</text>
  <text x="956" y="492" class="muted">Security &amp; regression review</text>

  <!-- BOTTOM GOVERNANCE & SCOREBOARD BAR -->
  <text x="40" y="544" class="zone">5. DETERMINISTIC HOOK GATES &amp; REVERSIBLE LIFECYCLE</text>

  <rect x="34" y="560" width="384" height="172" class="card-rose"/>
  <text x="58" y="598" class="h1">Human-Gated Hook Policy</text>
  <text x="58" y="628" class="body">Blocks edits to .github/*, .claude/*, config/*</text>
  <text x="58" y="654" class="body">Enforces 1-writer lock &amp; session budgets</text>
  <rect x="58" y="676" width="336" height="36" rx="8" fill="#1F0B14" stroke="#E11D48"/>
  <text x="226" y="699" text-anchor="middle" class="mono-rose">ASSURED_ARC_HUMAN_GATE = closed</text>

  <rect x="444" y="560" width="408" height="172" class="card-emerald"/>
  <text x="468" y="598" class="h1">External Scoreboard Gate</text>
  <text x="468" y="628" class="body">Stop hook runs scripts/scoreboard.py</text>
  <text x="468" y="654" class="body">32-hex nonce stops forged self-receipts</text>
  <rect x="468" y="676" width="360" height="36" rx="8" fill="#051B14" stroke="#10B981"/>
  <text x="648" y="699" text-anchor="middle" class="mono-emerald">verification-receipt: PASS</text>

  <rect x="878" y="560" width="368" height="172" class="card-cyan"/>
  <text x="902" y="598" class="h1">Reversible State &amp; Vault</text>
  <text x="902" y="628" class="body">State v4 SHA-256 · Doctor · Rollback</text>
  <text x="902" y="654" class="body">Markdown Obsidian Vault &amp; Privacy Receipts</text>
  <rect x="902" y="676" width="320" height="36" rx="8" fill="#0B192C" stroke="#38BDF8"/>
  <text x="1062" y="699" text-anchor="middle" class="mono">Auditable Delivery Ready</text>

  <!-- CAUSAL CONNECTOR PATHS (Animated) -->
  <path id="flow-objective-contract" data-motion-intent="causality: developer objective and host surfaces enter the dual-host contract" d="M 252 193 L 269 193 L 269 225 L 286 225" class="flow-rust"/>
  <path d="M 252 321 L 269 321 L 269 225 L 286 225" class="flow"/>
  <path d="M 252 449 L 269 449 L 269 225 L 286 225" class="route"/>
  <path d="M 409 312 L 409 330" class="flow-rust"/>

  <path id="flow-router-loop" data-motion-intent="progress: routed skills and contract enter bounded orchestrator loop" d="M 532 417 L 550 417 L 550 321 L 568 321" class="flow"/>

  <path id="flow-loop-workers" data-motion-intent="handoff: orchestrator dispatches isolated specialist workers" d="M 896 321 L 915 321 L 915 326 L 934 326" class="flow-rust"/>
  <path d="M 915 169 L 934 169 M 915 246 L 934 246 M 915 403 L 934 403 M 915 475 L 934 475 M 915 169 L 915 475" class="support"/>

  <path id="flow-scoreboard-release" data-motion-intent="verification: scoreboard gate releases verified outcome" d="M 732 504 L 732 560 M 852 646 L 878 646" class="flow-blue"/>

  <g>
    <circle r="9" fill="#F59E0B" opacity="0.3"/>
    <circle r="5" class="pulse-amber"/>
    <animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#flow-objective-contract"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="#38BDF8" opacity="0.3"/>
    <circle r="5" class="pulse-cyan"/>
    <animateMotion dur="2.0s" begin="0.5s" repeatCount="indefinite"><mpath href="#flow-router-loop"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="#F59E0B" opacity="0.3"/>
    <circle r="5" class="pulse-amber"/>
    <animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite"><mpath href="#flow-loop-workers"/></animateMotion>
  </g>
  <g>
    <circle r="10" fill="#10B981" opacity="0.3"/>
    <circle r="5.5" class="pulse-emerald"/>
    <animateMotion dur="2.0s" begin="1.5s" repeatCount="indefinite"><mpath href="#flow-scoreboard-release"/></animateMotion>
  </g>
</svg>
