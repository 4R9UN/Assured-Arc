<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Assured Arc agent harness architecture</title>
  <desc id="desc">An animated architecture map with an acceptance contract, native bounded orchestrator, isolated specialist workers, deterministic policy, optional knowledge, reviewed research tools, and independent evidence gates.</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="17" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray" result="faint"><feFuncA type="table" tableValues="0 .06"/></feComponentTransfer><feBlend in="SourceGraphic" in2="faint" mode="multiply"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#4a4033" flood-opacity=".15"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 8 L10 4 Z" fill="#3f6478"/></marker>
    <style>
      .paper{fill:#f3ead5}.frame{fill:none;stroke:#655c50;stroke-width:2;opacity:.4}.card{fill:#fbf4e5;stroke:#39332c;stroke-width:2.7}.blue{fill:#dce7e8}.sage{fill:#dfe6d4}.gold{fill:#ecdcae}.rust{fill:#eed2c3}.plum{fill:#e3dce7}.gray{fill:#ebe4d7}
      .flow{fill:none;stroke:#3f6478;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.link{fill:none;stroke:#62594f;stroke-width:2;stroke-linecap:round}.ring{fill:none;stroke:#3f6478;stroke-width:3}.bound{fill:none;stroke:#a85f49;stroke-width:2;opacity:.75}
      .title{font:700 43px 'Segoe Print','Bradley Hand',cursive;fill:#28231e}.subtitle{font:600 16px 'Segoe UI',sans-serif;fill:#62594f}.zone{font:800 13px 'Segoe UI',sans-serif;letter-spacing:3px;fill:#756a5d}.heading{font:700 22px 'Segoe Print','Bradley Hand',cursive;fill:#302b26}.label{font:700 16px 'Segoe Print','Bradley Hand',cursive;fill:#39332e}.body{font:600 13px 'Segoe UI',sans-serif;fill:#51483e}.micro{font:600 10px 'Segoe UI',sans-serif;fill:#665d51;letter-spacing:.2px}.phase{font:700 12px 'Segoe UI',sans-serif;fill:#302b26}.icon{fill:none;stroke:#39332c;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.tick{fill:none;stroke:#6c835e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.motion{fill:#a85f49;stroke:#fffaf0;stroke-width:3}.motionBlue{fill:#3f6478;stroke:#fffaf0;stroke-width:3}
      @media(prefers-reduced-motion:reduce){.motion,.motionBlue{display:none}}
    </style>
  </defs>
  <rect width="1600" height="1000" class="paper" filter="url(#paper)"/><path d="M30 30 Q800 16 1570 30 M30 970 Q800 984 1570 970 M30 30 Q18 500 30 970 M1570 30 Q1582 500 1570 970" class="frame"/>
  <text x="800" y="66" text-anchor="middle" class="title">Assured Arc Agent Harness</text><text x="800" y="96" text-anchor="middle" class="subtitle">One acceptance contract · one writer · independent proof · bounded repair</text>
  <text x="52" y="138" class="zone">INTENT + TRUST</text><text x="515" y="138" class="zone">BOUNDED ORCHESTRATION</text><text x="1110" y="138" class="zone">ISOLATED SPECIALISTS</text>

  <g transform="translate(48 165)"><rect width="390" height="500" rx="24" class="card gold" filter="url(#shadow)"/><text x="28" y="48" class="heading">Acceptance contract</text><text x="28" y="75" class="body">Turn intent into a measurable, reviewable boundary.</text>
    <circle cx="75" cy="144" r="27" class="icon"/><path d="M36 221 Q42 176 75 176 Q108 176 114 221 M55 181 L36 202 M95 181 L114 202" class="icon"/><rect x="137" y="119" width="220" height="73" rx="13" class="card blue"/><text x="247" y="149" text-anchor="middle" class="label">Developer objective</text><text x="247" y="174" text-anchor="middle" class="body">VS Code or Copilot CLI</text>
    <path d="M196 207 V244" class="flow"/><rect x="57" y="252" width="276" height="78" rx="14" class="card rust"/><text x="195" y="283" text-anchor="middle" class="label">Observable success</text><text x="195" y="307" text-anchor="middle" class="body">scope · constraints · stop signals</text>
    <path d="M196 331 V366" class="flow"/><rect x="57" y="374" width="276" height="78" rx="14" class="card plum"/><text x="195" y="405" text-anchor="middle" class="label">Trust boundary</text><text x="195" y="429" text-anchor="middle" class="body">external content remains untrusted data</text>
    <rect x="57" y="472" width="276" height="25" rx="8" class="card gray"/><text x="195" y="489" text-anchor="middle" class="micro">approval required for external side effects</text>
  </g>

  <g transform="translate(485 165)"><rect width="570" height="500" rx="24" class="card blue" filter="url(#shadow)"/><text x="28" y="48" class="heading">Native bounded orchestrator</text><text x="28" y="75" class="body">The coordinator owns every handoff and every stopping decision.</text>
    <circle cx="285" cy="278" r="172" fill="#fbf4e5" stroke="#a85f49" stroke-width="2"/><circle cx="285" cy="278" r="135" class="ring"/>
    <circle cx="285" cy="278" r="77" fill="#eed2c3" stroke="#39332c" stroke-width="3"/><path d="M243 259 Q285 225 327 259 M243 298 Q285 331 327 298" class="icon"/><circle cx="260" cy="278" r="5" fill="#39332c"/><circle cx="310" cy="278" r="5" fill="#39332c"/><text x="285" y="273" text-anchor="middle" class="heading">Orchestrator</text><text x="285" y="298" text-anchor="middle" class="micro">owns handoffs</text>
    <g><circle cx="285" cy="143" r="31" class="card gold"/><text x="285" y="147" text-anchor="middle" class="phase">CONTRACT</text><circle cx="391" cy="194" r="31" class="card sage"/><text x="391" y="198" text-anchor="middle" class="phase">ROUTE</text><circle cx="418" cy="307" r="31" class="card plum"/><text x="418" y="311" text-anchor="middle" class="phase">DELEGATE</text><circle cx="343" cy="407" r="31" class="card rust"/><text x="343" y="411" text-anchor="middle" class="phase">ACT</text><circle cx="227" cy="407" r="31" class="card gold"/><text x="227" y="411" text-anchor="middle" class="phase">VERIFY</text><circle cx="152" cy="307" r="31" class="card plum"/><text x="152" y="311" text-anchor="middle" class="phase">REPAIR</text><circle cx="179" cy="194" r="31" class="card sage"/><text x="179" y="198" text-anchor="middle" class="phase">COMPLETE</text></g>
    <path d="M316 150 C350 157 369 170 378 180 M411 224 C421 245 423 263 421 275 M405 336 C392 364 374 384 366 390 M311 415 H259 M204 390 C181 371 165 345 160 337 M151 275 C154 245 162 220 168 216 M201 172 C224 155 248 148 254 147" class="flow"/>
    <text x="285" y="470" text-anchor="middle" class="body">≤ 3 parallel workers · ≤ 7 invocations · ≤ 2 repairs</text>
  </g>

  <path id="flow-contract-orchestrator" data-motion-intent="handoff: accepted work enters orchestration" d="M438 415 L485 415" class="flow"/><path id="flow-orchestrator-specialists" data-motion-intent="handoff: orchestrator delegates to specialists" d="M1055 415 L1092 415" class="flow"/>

  <g transform="translate(1092 165)"><rect width="460" height="500" rx="24" class="card sage" filter="url(#shadow)"/><text x="28" y="48" class="heading">Specialist constellation</text><text x="28" y="75" class="body">Workers never talk directly. Only one worker can edit.</text><circle cx="230" cy="131" r="28" class="card gray"/><text x="230" y="137" text-anchor="middle" class="label">O</text>
    <g transform="translate(30 190)"><rect width="188" height="104" rx="16" class="card blue"/><path d="M25 57 L40 31 L55 57 M32 57 V72 H48 V57" class="icon"/><text x="76" y="43" class="label">Scout</text><text x="76" y="66" class="body">read + search</text><text x="76" y="86" class="micro">repository evidence</text></g>
    <g transform="translate(242 190)"><rect width="188" height="104" rx="16" class="card plum"/><circle cx="38" cy="47" r="15" class="icon"/><path d="M49 58 L62 71" class="icon"/><text x="76" y="43" class="label">Researcher</text><text x="76" y="66" class="body">web + MCP</text><text x="76" y="86" class="micro">never edits</text></g>
    <g transform="translate(136 312)"><rect width="188" height="116" rx="16" class="card rust"/><path d="M25 54 L48 31 L59 42 L36 65 Z M24 68 L38 64" class="icon"/><text x="76" y="45" class="label">Implementer</text><text x="76" y="68" class="body">read · edit · search</text><rect x="76" y="81" width="92" height="22" rx="7" class="card gold"/><text x="122" y="96" text-anchor="middle" class="micro">ONLY WRITER</text></g>
    <g transform="translate(30 446)"><rect width="188" height="40" rx="13" class="card gold"/><path d="M22 21 L31 29 L45 12" class="tick"/><text x="63" y="26" class="label">Verifier</text></g><g transform="translate(242 446)"><rect width="188" height="40" rx="13" class="card gray"/><circle cx="31" cy="20" r="11" class="icon"/><text x="58" y="26" class="label">Critic</text></g>
    <path d="M217 151 L130 185 M243 151 L330 185 M230 160 V307 M216 160 L124 441 M244 160 L336 441" class="link"/>
  </g>

  <text x="52" y="714" class="zone">SUPPORT PLANES</text>
  <g transform="translate(48 740)"><rect width="350" height="176" rx="20" class="card plum" filter="url(#shadow)"/><text x="24" y="39" class="heading">Optional knowledge</text><path d="M30 105 L58 76 L87 108 L116 79 L145 109" class="icon"/><circle cx="30" cy="105" r="6" fill="#75677c"/><circle cx="58" cy="76" r="6" fill="#75677c"/><circle cx="87" cy="108" r="6" fill="#75677c"/><circle cx="116" cy="79" r="6" fill="#75677c"/><circle cx="145" cy="109" r="6" fill="#75677c"/><text x="245" y="85" text-anchor="middle" class="label">Vault</text><text x="245" y="109" text-anchor="middle" class="body">MOCs · project notes</text><text x="175" y="151" text-anchor="middle" class="micro">durable context, never hidden execution state</text></g>
  <g transform="translate(426 740)"><rect width="350" height="176" rx="20" class="card blue" filter="url(#shadow)"/><text x="24" y="39" class="heading">Reviewed research</text><rect x="26" y="70" width="91" height="46" rx="10" class="card gray"/><rect x="130" y="70" width="91" height="46" rx="10" class="card gray"/><rect x="234" y="70" width="91" height="46" rx="10" class="card gray"/><text x="72" y="98" text-anchor="middle" class="body">Context7</text><text x="176" y="98" text-anchor="middle" class="body">Thinking</text><text x="280" y="98" text-anchor="middle" class="body">arXiv</text><text x="175" y="151" text-anchor="middle" class="micro">research is isolated from the writer</text></g>
  <g transform="translate(804 740)"><rect width="350" height="176" rx="20" class="card rust" filter="url(#shadow)"/><text x="24" y="39" class="heading">Deterministic policy</text><path d="M48 72 L82 85 L76 125 Q68 141 48 150 Q28 141 20 125 L14 85 Z" class="icon"/><path d="M31 112 L44 124 L66 98" class="tick"/><text x="112" y="84" class="label">allow · ask · deny</text><text x="112" y="109" class="body">writer lock · protected paths</text><text x="112" y="133" class="body">metadata-only local traces</text><text x="175" y="158" text-anchor="middle" class="micro">unknown mutation requires review</text></g>
  <g transform="translate(1182 740)"><rect width="370" height="176" rx="20" class="card gold" filter="url(#shadow)"/><text x="24" y="39" class="heading">Evidence gate</text><circle cx="82" cy="102" r="35" class="card gray"/><path d="M65 103 L78 117 L101 87" class="tick"/><path id="flow-verify-repair" data-motion-intent="repair: failed verification returns bounded evidence" d="M121 102 L185 102" class="flow"/><circle cx="230" cy="102" r="35" class="card plum"/><path d="M211 98 Q230 74 250 98 M249 98 L247 82 M249 98 L233 99" class="icon"/><text x="315" y="88" text-anchor="middle" class="label">Verify</text><text x="315" y="112" text-anchor="middle" class="body">repair ≤ 2</text><text x="315" y="136" text-anchor="middle" class="micro">repeat → stop</text></g>
  <text x="800" y="960" text-anchor="middle" class="micro">Editable SVG · animated causal flow · policy, agents, hooks, state, and tests remain canonical</text>
  <circle r="8" class="motion"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#flow-contract-orchestrator"/></animateMotion></circle><circle r="8" class="motionBlue"><animateMotion dur="3.8s" begin=".8s" repeatCount="indefinite"><mpath href="#flow-orchestrator-specialists"/></animateMotion></circle><circle r="7" class="motionBlue"><animateMotion dur="3.4s" begin="1.3s" repeatCount="indefinite"><mpath href="#flow-verify-repair"/></animateMotion></circle>
</svg>
