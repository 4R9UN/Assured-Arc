<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Assured Arc v1.1.0 Agent Harness &amp; Scoreboard Gate</title>
  <desc id="desc">Crisp technical architecture of the Assured Arc v1.1.0 Disposable Agent Harness showing the Shared Dual-Host Contract, Native Bounded Orchestrator, Isolated Specialist Constellation, Strict Human Gate, and Nonce-Verified External Scoreboard Stop Gate.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10B981"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#F59E0B"/>
    </marker>
    <style>
      .title { font: 800 23px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; letter-spacing: 0.4px; }
      .subtitle { font: 600 12.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #94A3B8; }
      .zone { font: 800 11px 'Segoe UI', Inter, system-ui, sans-serif; fill: #64748B; letter-spacing: 2px; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .card-cyan { fill: #0F1E36; stroke: #0284C7; stroke-width: 1.8; rx: 12; }
      .card-violet { fill: #1E1436; stroke: #9333EA; stroke-width: 1.8; rx: 12; }
      .card-amber { fill: #271C0C; stroke: #D97706; stroke-width: 1.8; rx: 12; }
      .card-emerald { fill: #09261E; stroke: #059669; stroke-width: 1.8; rx: 12; }
      .card-rose { fill: #2A121D; stroke: #E11D48; stroke-width: 1.8; rx: 12; }
      .card-slate { fill: #161F30; stroke: #475569; stroke-width: 1.5; rx: 10; }
      .h1 { font: 700 15px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; }
      .h2 { font: 700 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #E2E8F0; }
      .body { font: 600 11.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #CBD5E1; }
      .muted { font: 500 10.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #94A3B8; }
      .mono { font: 600 10.5px 'Cascadia Code', Consolas, monospace; fill: #38BDF8; }
      .mono-amber { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #FBBF24; }
      .mono-emerald { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #34D399; }
      .mono-rose { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #FB7185; }
      .mono-violet { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #C084FC; }
      .flow { fill: none; stroke: #38BDF8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-cyan); }
      .flow-blue { fill: none; stroke: #10B981; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-emerald); }
      .flow-rust { fill: none; stroke: #F59E0B; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .pulse-cyan { fill: #38BDF8; stroke: #F8FAFC; stroke-width: 2; }
      .pulse-amber { fill: #F59E0B; stroke: #F8FAFC; stroke-width: 2; }
      .pulse-emerald { fill: #10B981; stroke: #F8FAFC; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1280" height="760" fill="url(#bg-grad)"/>
  <rect width="1280" height="760" fill="url(#grid)"/>
  <rect x="16" y="16" width="1248" height="728" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="26" width="1224" height="62" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="44" y="41" width="110" height="32" rx="8" fill="#1E1436" stroke="#9333EA" stroke-width="1.5"/>
  <text x="99" y="61" text-anchor="middle" class="mono-violet">HARNESS v1.1</text>
  <text x="172" y="53" class="title">DISPOSABLE AGENT HARNESS &amp; SCOREBOARD GATE</text>
  <text x="172" y="73" class="subtitle">Canonical Contract → Bounded Subagents → Single-Writer Isolation → Nonce-Verified Stop Gate</text>
  <text x="36" y="114" class="zone">INTENT + DUAL-HOST CONTRACT</text>
  <text x="434" y="114" class="zone">NATIVE BOUNDED ORCHESTRATION</text>
  <text x="878" y="114" class="zone">DISPOSABLE WORKER CONSTELLATION</text>

  <!-- PANEL 1: CONTRACT & TRUST -->
  <rect x="34" y="128" width="356" height="390" class="card-amber"/>
  <text x="54" y="158" class="h1">1. Canonical Bounded Contract</text>
  <text x="54" y="178" class="mono-amber">config/agent-contract.json (v1.1.0)</text>

  <rect x="54" y="196" width="316" height="66" class="card-cyan"/>
  <text x="72" y="220" class="h2">Dual-Host Adapter Generation</text>
  <text x="72" y="240" class="body">Copilot (.github/agents) + Claude (.claude/agents)</text>
  <text x="72" y="255" class="mono">scripts/render_contract.py</text>

  <rect x="54" y="276" width="316" height="72" class="card-slate"/>
  <text x="72" y="300" class="h2">On-Task Allowed Scope</text>
  <text x="72" y="320" class="body">• Restate criteria &amp; narrow file write scope</text>
  <text x="72" y="338" class="body">• Pick ≤3 trusted skills &amp; existing roles</text>

  <rect x="54" y="362" width="316" height="78" class="card-rose"/>
  <text x="72" y="386" class="h2">On-Task Forbidden (Human-Gated)</text>
  <text x="72" y="406" class="body">• Cannot add agents, skills, hooks, or MCP</text>
  <text x="72" y="424" class="mono-rose">PreToolUse denies before fallback ask</text>

  <rect x="54" y="454" width="316" height="46" rx="8" fill="#09261E" stroke="#10B981" stroke-width="1.5"/>
  <text x="212" y="474" text-anchor="middle" class="mono-emerald">requireExternalVerificationAfterWrite: true</text>
  <text x="212" y="491" text-anchor="middle" class="muted">Agents cannot self-score completion</text>

  <!-- PANEL 2: NATIVE BOUNDED ORCHESTRATOR -->
  <rect x="434" y="128" width="400" height="390" class="card-cyan"/>
  <text x="454" y="158" class="h1">2. Bounded Orchestrator Loop</text>
  <text x="454" y="178" class="mono">Depth = 1 · Writers = 1 · Parallel ≤ 3 · Repairs ≤ 2</text>

  <circle cx="634" cy="322" r="118" fill="#0B1325" stroke="#0284C7" stroke-width="2"/>
  <circle cx="634" cy="322" r="70" fill="#161F30" stroke="#38BDF8" stroke-width="2.5"/>
  <text x="634" y="312" text-anchor="middle" class="h1">Orchestrator</text>
  <text x="634" y="330" text-anchor="middle" class="mono">read · search · agent</text>
  <text x="634" y="347" text-anchor="middle" class="muted">Owns all handoffs</text>

  <rect x="586" y="186" width="96" height="26" rx="6" fill="#271C0C" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="634" y="203" text-anchor="middle" class="mono-amber">CONTRACT</text>
  <rect x="706" y="224" width="84" height="26" rx="6" fill="#0F1E36" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="748" y="241" text-anchor="middle" class="mono">ROUTE ≤3</text>
  <rect x="722" y="308" width="92" height="26" rx="6" fill="#1E1436" stroke="#A855F7" stroke-width="1.5"/>
  <text x="768" y="325" text-anchor="middle" class="mono-violet">DELEGATE</text>
  <rect x="700" y="394" width="88" height="26" rx="6" fill="#271C0C" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="744" y="411" text-anchor="middle" class="mono-amber">ACT (1W)</text>
  <rect x="586" y="432" width="96" height="26" rx="6" fill="#09261E" stroke="#10B981" stroke-width="1.5"/>
  <text x="634" y="449" text-anchor="middle" class="mono-emerald">VERIFY</text>
  <rect x="474" y="394" width="92" height="26" rx="6" fill="#2A121D" stroke="#E11D48" stroke-width="1.5"/>
  <text x="520" y="411" text-anchor="middle" class="mono-rose">REPAIR ≤2</text>
  <rect x="462" y="268" width="96" height="26" rx="6" fill="#09261E" stroke="#10B981" stroke-width="1.5"/>
  <text x="510" y="285" text-anchor="middle" class="mono-emerald">COMPLETE</text>
  <text x="634" y="496" text-anchor="middle" class="body">Stops on pass, budget limit, or repeated identical failure</text>
  <!-- PANEL 3: ISOLATED SPECIALISTS -->
  <rect x="878" y="128" width="368" height="390" class="card"/>
  <text x="898" y="158" class="h1">3. Context-Isolated Workers</text>
  <text x="898" y="178" class="muted">Each worker has agents: [] — no nested spawning</text>

  <rect x="898" y="194" width="328" height="52" class="card-cyan"/>
  <text x="914" y="216" class="h2">Scout</text>
  <text x="1210" y="216" text-anchor="end" class="mono">Read · Grep · Glob</text>
  <text x="914" y="235" class="muted">Maps local files &amp; constraints</text>

  <rect x="898" y="256" width="328" height="52" class="card-violet"/>
  <text x="914" y="278" class="h2">Researcher</text>
  <text x="1210" y="278" text-anchor="end" class="mono-violet">Web · Context7 · arXiv</text>
  <text x="914" y="297" class="muted">External evidence only · Never edits code</text>

  <rect x="898" y="318" width="328" height="62" class="card-amber"/>
  <text x="914" y="341" class="h2">Implementer (Single Writer)</text>
  <text x="1210" y="341" text-anchor="end" class="mono-amber">Read · Edit · Write</text>
  <text x="914" y="362" class="body">No Bash/Execute · No Web/MCP · Triggers Stop Gate</text>

  <rect x="898" y="390" width="328" height="52" class="card-emerald"/>
  <text x="914" y="412" class="h2">Verifier</text>
  <text x="1210" y="412" text-anchor="end" class="mono-emerald">Read · Search · Bash</text>
  <text x="914" y="431" class="muted">Independent test execution · No file edits</text>

  <rect x="898" y="452" width="328" height="52" class="card-slate"/>
  <text x="914" y="474" class="h2">Critic</text>
  <text x="1210" y="474" text-anchor="end" class="mono">Read · Search</text>
  <text x="914" y="493" class="muted">Reviews correctness, security &amp; rollback risk</text>

  <!-- BOTTOM PLANES -->
  <text x="36" y="546" class="zone">DETERMINISTIC HOOK ENFORCEMENT &amp; SCOREBOARD RECEIPT FLOW</text>

  <rect x="34" y="560" width="280" height="166" class="card-rose"/>
  <text x="52" y="586" class="h1">PreToolUse Human Gate</text>
  <text x="52" y="610" class="body">• Checks _human_gate_decision first</text>
  <text x="52" y="630" class="body">• Denies edits to .github/*, .claude/*,</text>
  <text x="52" y="648" class="body">  config/*, hooks/*, scripts/*, mcp/*</text>
  <text x="52" y="668" class="body">• Enforces writer lock &amp; tool budget</text>
  <text x="52" y="696" class="mono-rose">Override: ASSURED_ARC_HUMAN_GATE=open</text>

  <rect x="332" y="560" width="280" height="166" class="card-amber"/>
  <text x="350" y="586" class="h1">PostToolUse Write Tracker</text>
  <text x="350" y="610" class="body">• Detects Edit, Write, apply_patch</text>
  <text x="350" y="630" class="body">• Sets pendingVerification = true</text>
  <text x="350" y="650" class="body">• Generates fresh verificationNonce</text>
  <text x="350" y="670" class="body">• Model-written receipts ignored</text>
  <text x="350" y="696" class="mono-amber">State locked until scoreboard passes</text>

  <rect x="630" y="560" width="616" height="166" class="card-emerald"/>
  <text x="650" y="586" class="h1">Stop Hook Scoreboard Gate (scripts/scoreboard.py)</text>
  <rect x="650" y="604" width="250" height="96" class="card-slate"/>
  <text x="668" y="628" class="h2">1. Execute Approved Checks</text>
  <text x="668" y="648" class="body">Runs config/scoreboard.json</text>
  <text x="668" y="668" class="mono">config/checks/approved_check.py</text>
  <text x="668" y="686" class="muted">Injects 32-hex nonce via env</text>

  <rect x="966" y="604" width="260" height="96" class="card-cyan"/>
  <text x="984" y="628" class="h2">2. Verify Nonce Receipt</text>
  <text x="984" y="648" class="body">Matches session + nonce + pass</text>
  <text x="984" y="668" class="mono-emerald">Clears pendingVerification</text>
  <text x="984" y="686" class="muted">Writes sanitized run receipt</text>

  <path id="flow-contract-orchestrator" data-motion-intent="handoff: accepted work enters orchestration" d="M 390 322 L 434 322" class="flow-rust"/>
  <path id="flow-orchestrator-specialists" data-motion-intent="handoff: orchestrator delegates to specialists" d="M 834 322 L 878 322" class="flow"/>
  <path id="flow-verify-repair" data-motion-intent="repair: scoreboard executes and validates nonce receipt" d="M 900 652 L 966 652" class="flow-blue"/>

  <g>
    <circle r="9" fill="#F59E0B" opacity="0.28"/>
    <circle r="5" class="pulse-amber"/>
    <animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#flow-contract-orchestrator"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="#38BDF8" opacity="0.28"/>
    <circle r="5" class="pulse-cyan"/>
    <animateMotion dur="2.0s" begin="0.6s" repeatCount="indefinite"><mpath href="#flow-orchestrator-specialists"/></animateMotion>
  </g>
  <g>
    <circle r="10" fill="#10B981" opacity="0.28"/>
    <circle r="5.5" class="pulse-emerald"/>
    <animateMotion dur="2.0s" begin="1.2s" repeatCount="indefinite"><mpath href="#flow-verify-repair"/></animateMotion>
  </g>
</svg>
