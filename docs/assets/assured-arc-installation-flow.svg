<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Assured Arc installation and rollback flow</title>
  <desc id="desc">A clean animated route from review and dry run through preflight, backup, managed installation, ownership recording, verification, daily use, and reversible uninstall.</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="23" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray" result="faint"><feFuncA type="table" tableValues="0 .06"/></feComponentTransfer><feBlend in="SourceGraphic" in2="faint" mode="multiply"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#4a4033" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 8 L10 4 Z" fill="#3f6478"/></marker>
    <style>
      .paper{fill:#f3ead5}.frame{fill:none;stroke:#655c50;stroke-width:2;opacity:.42}.route{fill:none;stroke:#3f6478;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .card{fill:#fbf4e5;stroke:#39332c;stroke-width:2.7}.blue{fill:#dce7e8}.sage{fill:#dfe6d4}.gold{fill:#ecdcae}.rust{fill:#eed2c3}.plum{fill:#e3dce7}.gray{fill:#ebe4d7}
      .title{font:700 42px 'Segoe Print','Bradley Hand',cursive;fill:#28231e}.subtitle{font:600 16px 'Segoe UI',sans-serif;fill:#62594f;letter-spacing:.3px}
      .section{font:700 20px 'Segoe Print','Bradley Hand',cursive;fill:#302b26}.label{font:700 17px 'Segoe Print','Bradley Hand',cursive;fill:#39332e}.body{font:600 13px 'Segoe UI',sans-serif;fill:#51483e}.micro{font:600 11px 'Segoe UI',sans-serif;fill:#655c50;letter-spacing:.2px}.num{font:800 16px 'Segoe UI',sans-serif;fill:#fffaf0}
      .icon{fill:none;stroke:#39332c;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.tick{fill:none;stroke:#6c835e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.motion{fill:#a85f49;stroke:#fffaf0;stroke-width:3}
      @media(prefers-reduced-motion:reduce){.motion{display:none}}
    </style>
  </defs>
  <rect width="1600" height="920" class="paper" filter="url(#paper)"/>
  <path d="M30 30 Q800 16 1570 30 M30 890 Q800 904 1570 890 M30 30 Q18 460 30 890 M1570 30 Q1582 460 1570 890" class="frame"/>
  <text x="800" y="66" text-anchor="middle" class="title">Install with confidence. Reverse with proof.</text>
  <text x="800" y="96" text-anchor="middle" class="subtitle">A visible ownership chain from repository review to verified daily use</text>
  <path id="flow-preview-install" data-motion-intent="progress: approved preview proceeds to managed installation" d="M365 350 L365 455" class="route"/>
  <path id="flow-ownership-surface" data-motion-intent="ownership: recorded state maps to installed assets" d="M1229 350 L1229 415 L920 415 L920 455" class="route"/>
  <g id="steps">
    <g transform="translate(54 160)"><rect width="190" height="190" rx="20" class="card blue" filter="url(#shadow)"/><circle cx="28" cy="28" r="17" fill="#3f6478"/><text x="28" y="34" text-anchor="middle" class="num">1</text><path d="M50 76 H140 V133 H50 Z M50 94 H140 M66 85 H72 M79 85 H85" class="icon"/><text x="95" y="158" text-anchor="middle" class="label">Review source</text><text x="95" y="178" text-anchor="middle" class="micro">clone · inspect · trust</text></g>
    <g transform="translate(270 160)"><rect width="190" height="190" rx="20" class="card gold" filter="url(#shadow)"/><circle cx="28" cy="28" r="17" fill="#b38a3f"/><text x="28" y="34" text-anchor="middle" class="num">2</text><rect x="47" y="70" width="96" height="65" rx="7" class="icon"/><path d="M62 92 L80 102 L62 113 M91 114 H125" class="icon"/><text x="95" y="158" text-anchor="middle" class="label">Preview plan</text><text x="95" y="178" text-anchor="middle" class="micro">dry run · no writes</text></g>
    <g transform="translate(486 160)"><rect width="190" height="190" rx="20" class="card rust" filter="url(#shadow)"/><circle cx="28" cy="28" r="17" fill="#a85f49"/><text x="28" y="34" text-anchor="middle" class="num">3</text><path d="M49 78 H78 V130 H49 Z M82 78 H111 V130 H82 Z M115 78 H144 V130 H115 Z" class="icon"/><text x="64" y="106" text-anchor="middle" class="micro">VS</text><text x="97" y="106" text-anchor="middle" class="micro">Py</text><text x="130" y="106" text-anchor="middle" class="micro">uv</text><text x="95" y="158" text-anchor="middle" class="label">Check host</text><text x="95" y="178" text-anchor="middle" class="micro">fail closed if missing</text></g>
    <g transform="translate(702 160)"><rect width="190" height="190" rx="20" class="card plum" filter="url(#shadow)"/><circle cx="28" cy="28" r="17" fill="#75677c"/><text x="28" y="34" text-anchor="middle" class="num">4</text><path d="M42 93 H91 L103 104 H148 V136 H42 Z M64 77 H119 V104" class="icon"/><text x="95" y="158" text-anchor="middle" class="label">Back up first</text><text x="95" y="178" text-anchor="middle" class="micro">preserve originals</text></g>
    <g transform="translate(918 160)"><rect width="190" height="190" rx="20" class="card sage" filter="url(#shadow)"/><circle cx="28" cy="28" r="17" fill="#6c835e"/><text x="28" y="34" text-anchor="middle" class="num">5</text><rect x="38" y="78" width="114" height="56" rx="10" class="icon"/><path d="M68 106 H122 M95 88 V124" class="icon"/><text x="95" y="158" text-anchor="middle" class="label">Install assets</text><text x="95" y="178" text-anchor="middle" class="micro">merge · never replace</text></g>
    <g transform="translate(1134 160)"><rect width="190" height="190" rx="20" class="card gray" filter="url(#shadow)"/><circle cx="28" cy="28" r="17" fill="#6a6257"/><text x="28" y="34" text-anchor="middle" class="num">6</text><path d="M48 73 H128 L144 89 V135 H48 Z M128 73 V90 H144" class="icon"/><text x="96" y="105" text-anchor="middle" class="micro">state.json</text><text x="95" y="158" text-anchor="middle" class="label">Record ownership</text><text x="95" y="178" text-anchor="middle" class="micro">files · settings · hash</text></g>
    <g transform="translate(1350 160)"><rect width="190" height="190" rx="20" class="card blue" filter="url(#shadow)"/><circle cx="28" cy="28" r="17" fill="#3f6478"/><text x="28" y="34" text-anchor="middle" class="num">7</text><circle cx="95" cy="104" r="34" class="icon"/><path d="M76 105 L90 120 L116 87" class="tick"/><text x="95" y="158" text-anchor="middle" class="label">Reload + verify</text><text x="95" y="178" text-anchor="middle" class="micro">diagnostics · tests</text></g>
  </g>
  <g transform="translate(54 455)"><rect width="1010" height="260" rx="24" class="card" filter="url(#shadow)"/><text x="32" y="45" class="section">Installed surface</text><text x="32" y="70" class="body">Every destination is explicit. Optional capabilities stay visibly optional.</text>
    <g transform="translate(32 100)"><rect width="170" height="104" rx="16" class="card blue"/><path d="M52 26 H118 V67 H52 Z M71 80 H99 M85 67 V80" class="icon"/><text x="85" y="96" text-anchor="middle" class="label">VS Code</text></g>
    <g transform="translate(222 100)"><rect width="170" height="104" rx="16" class="card rust"/><rect x="51" y="24" width="68" height="45" rx="6" fill="#30343a"/><text x="85" y="52" text-anchor="middle" class="body" fill="#fffaf0">&gt;_ CLI</text><text x="85" y="96" text-anchor="middle" class="label">Copilot CLI</text></g>
    <g transform="translate(412 100)"><rect width="170" height="104" rx="16" class="card sage"/><circle cx="66" cy="42" r="12" class="icon"/><circle cx="104" cy="42" r="12" class="icon"/><path d="M78 42 H92" class="icon"/><text x="85" y="96" text-anchor="middle" class="label">Agents + skills</text></g>
    <g transform="translate(602 100)"><rect width="170" height="104" rx="16" class="card plum"/><path d="M48 62 L70 32 L91 58 L111 36 L128 63" class="icon"/><text x="85" y="96" text-anchor="middle" class="label">Vault</text></g>
    <g transform="translate(792 100)"><rect width="186" height="104" rx="16" class="card gold"/><path d="M51 50 H135 M64 34 L51 50 L64 66 M122 34 L135 50 L122 66" class="icon"/><text x="93" y="96" text-anchor="middle" class="label">Research MCP</text></g>
  </g>
  <g transform="translate(1100 455)"><rect width="440" height="260" rx="24" class="card rust" filter="url(#shadow)"/><text x="30" y="45" class="section">Uninstall or rollback</text><text x="30" y="72" class="body">Read the ownership ledger before removing anything.</text><path d="M58 165 C78 120 143 113 165 151 C181 183 157 207 126 207" class="icon"/><path d="M59 165 V134 M59 165 H89" class="icon"/><text x="304" y="135" text-anchor="middle" class="label">Remove owned entries</text><text x="304" y="163" text-anchor="middle" class="body">Preserve unrelated settings</text><text x="304" y="190" text-anchor="middle" class="body">Restore backups on request</text><rect x="245" y="211" width="118" height="28" rx="9" class="card gold"/><text x="304" y="230" text-anchor="middle" class="micro">integrity checked</text></g>
  <path id="flow-surface-rollback" data-motion-intent="reversal: owned assets can enter rollback" d="M1064 585 L1100 585" class="route"/>
  <text x="800" y="878" text-anchor="middle" class="micro">Editable SVG · animated flow · installation behavior remains defined by scripts, state, and validation</text>
  <circle r="8" class="motion"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#flow-preview-install"/></animateMotion></circle>
  <circle r="8" class="motion"><animateMotion dur="4.2s" begin=".8s" repeatCount="indefinite"><mpath href="#flow-ownership-surface"/></animateMotion></circle>
  <circle r="8" class="motion"><animateMotion dur="3.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#flow-surface-rollback"/></animateMotion></circle>
</svg>
