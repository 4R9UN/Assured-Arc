<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Assured Arc v1.1.0 Installation, Ownership &amp; Rollback Lifecycle</title>
  <desc id="desc">Modern animated diagram of the 7-step Assured Arc v1.1.0 installation pipeline, managed dual-host surfaces (VS Code, Copilot CLI, Claude Code, Scoreboard, Vault, MCP), and checksum-verified rollback/uninstall.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1325"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10B981"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#FB7185"/>
    </marker>
    <style>
      .title { font: 800 23px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; letter-spacing: 0.4px; }
      .subtitle { font: 600 12.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #94A3B8; }
      .zone { font: 800 11px 'Segoe UI', Inter, system-ui, sans-serif; fill: #64748B; letter-spacing: 2px; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .card-cyan { fill: #0F1E36; stroke: #0284C7; stroke-width: 1.8; rx: 12; }
      .card-violet { fill: #1E1436; stroke: #9333EA; stroke-width: 1.8; rx: 12; }
      .card-amber { fill: #271C0C; stroke: #D97706; stroke-width: 1.8; rx: 12; }
      .card-emerald { fill: #09261E; stroke: #059669; stroke-width: 1.8; rx: 12; }
      .card-rose { fill: #2A121D; stroke: #E11D48; stroke-width: 1.8; rx: 12; }
      .card-slate { fill: #161F30; stroke: #475569; stroke-width: 1.5; rx: 10; }
      .h1 { font: 700 15px 'Segoe UI', Inter, system-ui, sans-serif; fill: #F8FAFC; }
      .h2 { font: 700 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #E2E8F0; }
      .body { font: 600 11.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #CBD5E1; }
      .muted { font: 500 10.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #94A3B8; }
      .mono { font: 600 10.5px 'Cascadia Code', Consolas, monospace; fill: #38BDF8; }
      .mono-amber { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #FBBF24; }
      .mono-emerald { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #34D399; }
      .mono-rose { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #FB7185; }
      .mono-violet { font: 700 10.5px 'Cascadia Code', Consolas, monospace; fill: #C084FC; }
      .route { fill: none; stroke: #38BDF8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-cyan); }
      .flow-blue { fill: none; stroke: #10B981; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-emerald); }
      .flow-rust { fill: none; stroke: #FB7185; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-rose); }
      .pulse-cyan { fill: #38BDF8; stroke: #F8FAFC; stroke-width: 2; }
      .pulse-emerald { fill: #10B981; stroke: #F8FAFC; stroke-width: 2; }
      .pulse-rose { fill: #FB7185; stroke: #F8FAFC; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-grad)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect x="16" y="16" width="1248" height="688" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="26" width="1224" height="62" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="44" y="41" width="114" height="32" rx="8" fill="#09261E" stroke="#10B981" stroke-width="1.5"/>
  <text x="101" y="61" text-anchor="middle" class="mono-emerald">STATE v4</text>
  <text x="176" y="53" class="title">INSTALL WITH CONFIDENCE · REVERSE WITH PROOF</text>
  <text x="176" y="73" class="subtitle">Idempotent Cross-Platform Installer · Dual-Host Adapter Rendering · Checksum State Ledger · Clean Uninstall</text>
  <text x="36" y="114" class="zone">7-STAGE REVERSIBLE INSTALLATION PIPELINE</text>

  <g transform="translate(34 128)">
    <rect width="160" height="142" class="card-cyan"/>
    <circle cx="26" cy="26" r="13" fill="#0284C7"/><text x="26" y="30" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="800" fill="#0B0F19">1</text>
    <text x="48" y="31" class="h2">Review Source</text>
    <text x="18" y="62" class="body">Clone &amp; inspect</text>
    <text x="18" y="82" class="body">manifest files</text>
    <text x="18" y="118" class="mono">Public-safe repo</text>
  </g>

  <g transform="translate(209 128)">
    <rect width="160" height="142" class="card-amber"/>
    <circle cx="26" cy="26" r="13" fill="#D97706"/><text x="26" y="30" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="800" fill="#0B0F19">2</text>
    <text x="48" y="31" class="h2">Dry Run</text>
    <text x="18" y="62" class="body">Preview every</text>
    <text x="18" y="82" class="body">planned change</text>
    <text x="18" y="118" class="mono-amber">-DryRun / --dry-run</text>
  </g>

  <g transform="translate(384 128)">
    <rect width="160" height="142" class="card-emerald"/>
    <circle cx="26" cy="26" r="13" fill="#059669"/><text x="26" y="30" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="800" fill="#0B0F19">3</text>
    <text x="48" y="31" class="h2">Preflight</text>
    <text x="18" y="62" class="body">Check symlink</text>
    <text x="18" y="82" class="body">safety &amp; tools</text>
    <text x="18" y="118" class="mono-emerald">Rejects junctions</text>
  </g>

  <g transform="translate(559 128)">
    <rect width="160" height="142" class="card-slate"/>
    <circle cx="26" cy="26" r="13" fill="#64748B"/><text x="26" y="30" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="800" fill="#0B0F19">4</text>
    <text x="48" y="31" class="h2">Backup First</text>
    <text x="18" y="62" class="body">Snapshot prior</text>
    <text x="18" y="82" class="body">user configs</text>
    <text x="18" y="118" class="mono">backups/ preserved</text>
  </g>

  <g transform="translate(734 128)">
    <rect width="160" height="142" class="card-violet"/>
    <circle cx="26" cy="26" r="13" fill="#9333EA"/><text x="26" y="30" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="800" fill="#0B0F19">5</text>
    <text x="48" y="31" class="h2">Render &amp; Copy</text>
    <text x="18" y="62" class="body">Install Copilot,</text>
    <text x="18" y="82" class="body">Claude &amp; Gates</text>
    <text x="18" y="118" class="mono-violet">render_contract.py</text>
  </g>

  <g transform="translate(909 128)">
    <rect width="160" height="142" class="card-amber"/>
    <circle cx="26" cy="26" r="13" fill="#D97706"/><text x="26" y="30" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="800" fill="#0B0F19">6</text>
    <text x="48" y="31" class="h2">Record Ledger</text>
    <text x="18" y="62" class="body">Write state.json</text>
    <text x="18" y="82" class="body">+ SHA-256 hash</text>
    <text x="18" y="118" class="mono-amber">Exact ownership</text>
  </g>

  <g transform="translate(1084 128)">
    <rect width="162" height="142" class="card-emerald"/>
    <circle cx="26" cy="26" r="13" fill="#10B981"/><text x="26" y="30" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="800" fill="#0B0F19">7</text>
    <text x="48" y="31" class="h2">Doctor &amp; Use</text>
    <text x="18" y="62" class="body">Read-only health</text>
    <text x="18" y="82" class="body">&amp; gate checks</text>
    <text x="18" y="118" class="mono-emerald">PASS diagnostics</text>
  </g>
  <!-- Row 2: Managed Surface vs Rollback -->
  <text x="36" y="330" class="zone">MANAGED PROFILE SURFACE (~/.assured-arc) &amp; HOST ADAPTERS</text>
  <text x="888" y="330" class="zone">REVERSIBLE UNINSTALL &amp; ROLLBACK</text>

  <rect x="34" y="344" width="820" height="330" class="card"/>
  <text x="56" y="374" class="h1">Package-Owned Customization Surface</text>
  <text x="56" y="394" class="muted">Merges missing keys without overwriting unrelated personal skills, prompts, or MCP servers</text>

  <rect x="56" y="414" width="246" height="110" class="card-cyan"/>
  <text x="74" y="440" class="h2">VS Code Copilot Surface</text>
  <text x="74" y="462" class="body">• 12 Agents + 6 Slash Prompts</text>
  <text x="74" y="482" class="body">• 27 Skills + 2 Global Instructions</text>
  <text x="74" y="504" class="mono">chat.*Locations registered</text>

  <rect x="320" y="414" width="246" height="110" class="card-slate"/>
  <text x="338" y="440" class="h2">Copilot CLI Profile (Opt-In)</text>
  <text x="338" y="462" class="body">• Shared Agents &amp; Instructions</text>
  <text x="338" y="482" class="body">• CLI Hooks &amp; skillDirectories</text>
  <text x="338" y="504" class="mono">-InstallCopilotCli</text>

  <rect x="584" y="414" width="248" height="110" class="card-violet"/>
  <text x="602" y="440" class="h2">Claude Code Adapter</text>
  <text x="602" y="462" class="body">• 6 Contract-Rendered Agents</text>
  <text x="602" y="482" class="body">• Hook Settings + Contract Copy</text>
  <text x="602" y="504" class="mono-violet">&lt;profile&gt;/claude/*</text>

  <rect x="56" y="542" width="246" height="110" class="card-emerald"/>
  <text x="74" y="568" class="h2">Scoreboard &amp; Policy Hooks</text>
  <text x="74" y="590" class="body">• harness_event.py / .ps1</text>
  <text x="74" y="610" class="body">• scoreboard.py + approved_check</text>
  <text x="74" y="632" class="mono-emerald">ASSURED_ARC_SCOREBOARD*</text>

  <rect x="320" y="542" width="246" height="110" class="card-amber"/>
  <text x="338" y="568" class="h2">Reviewed Research MCP</text>
  <text x="338" y="590" class="body">• Context7 (Hosted HTTPS)</text>
  <text x="338" y="610" class="body">• Sequential Thinking 2026.7.4</text>
  <text x="338" y="632" class="mono-amber">arXiv MCP 0.5.1 (uv isolated)</text>

  <rect x="584" y="542" width="248" height="110" class="card-slate"/>
  <text x="602" y="568" class="h2">Obsidian Markdown Vault</text>
  <text x="602" y="590" class="body">• Home.md + MOCs + Templates</text>
  <text x="602" y="610" class="body">• local-only/ privacy boundary</text>
  <text x="602" y="632" class="mono">Standard portable Markdown</text>

  <rect x="888" y="344" width="358" height="330" class="card-rose"/>
  <text x="910" y="374" class="h1">Checksum-Verified Removal</text>
  <text x="910" y="394" class="mono-rose">install/uninstall.ps1 | uninstall.sh</text>

  <rect x="910" y="414" width="314" height="72" class="card-slate"/>
  <text x="928" y="438" class="h2">1. Verify Ownership Ledger</text>
  <text x="928" y="458" class="body">Validates state.json SHA-256 checksum</text>
  <text x="928" y="475" class="muted">Refuses relative or linked paths</text>

  <rect x="910" y="500" width="314" height="72" class="card-slate"/>
  <text x="928" y="524" class="h2">2. Surgical Asset Removal</text>
  <text x="928" y="544" class="body">Removes Copilot, CLI, Claude &amp; Scoreboard</text>
  <text x="928" y="561" class="muted">Preserves unrelated user settings &amp; MCPs</text>

  <rect x="910" y="586" width="314" height="66" class="card-amber"/>
  <text x="928" y="610" class="h2">3. Optional Full Restore</text>
  <text x="928" y="630" class="body">Restores pre-install backups on demand</text>
  <text x="928" y="646" class="mono-amber">-RestoreBackups / --restore-backups</text>

  <path id="flow-preview-install" data-motion-intent="progress: approved preview proceeds through 7-step install pipeline" d="M 114 270 L 114 298 L 1165 298 L 1165 270" class="route"/>
  <path id="flow-ownership-surface" data-motion-intent="ownership: recorded state maps to installed dual-host assets" d="M 989 270 L 989 312 L 444 312 L 444 344" class="flow-blue"/>
  <path id="flow-surface-rollback" data-motion-intent="reversal: owned assets can enter surgical uninstall or rollback" d="M 854 509 L 888 509" class="flow-rust"/>

  <g>
    <circle r="9" fill="#38BDF8" opacity="0.28"/>
    <circle r="5" class="pulse-cyan"/>
    <animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#flow-preview-install"/></animateMotion>
  </g>
  <g>
    <circle r="10" fill="#10B981" opacity="0.28"/>
    <circle r="5.5" class="pulse-emerald"/>
    <animateMotion dur="2.0s" begin="0.7s" repeatCount="indefinite"><mpath href="#flow-ownership-surface"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="#FB7185" opacity="0.28"/>
    <circle r="5" class="pulse-rose"/>
    <animateMotion dur="2.0s" begin="1.3s" repeatCount="indefinite"><mpath href="#flow-surface-rollback"/></animateMotion>
  </g>
</svg>
